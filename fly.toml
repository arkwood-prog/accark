# fly.io deployment. Gives a public HTTPS URL you can add to a phone home screen.
#
#   fly launch --no-deploy --copy-config
#   fly secrets set BETTINGEDGE_TOKEN=$(openssl rand -hex 16)
#   fly deploy
#
# Then open https://<app>.fly.dev/?token=<the token> once on the phone.
app = "bettingedge"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  BETTINGEDGE_LEAGUE = "EC"
  BETTINGEDGE_SEASONS = "6"

[http_service]
  internal_port = 8000
  force_https = true
  # The model is refitted in memory, so let the machine sleep when unused and
  # wake on request. First hit after a sleep takes a few seconds.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # Fitting needs headroom; 256MB is not enough for scipy plus the history.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
