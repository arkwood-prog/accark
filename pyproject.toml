[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bettingedge"
version = "1.0.0"
description = "Data-driven football betting analysis: Dixon-Coles modelling, market devigging, value detection and Kelly staking for singles, doubles, trebles and accumulators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.28",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Prints a scannable QR of the LAN URL when you run `bettingedge serve --lan`.
qr = ["qrcode>=7.0"]

[project.scripts]
bettingedge = "bettingedge.cli:main"

[tool.setuptools.packages.find]
include = ["bettingedge*"]

[tool.setuptools.package-data]
bettingedge = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
